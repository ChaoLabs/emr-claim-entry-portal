<style>
.response-head { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:24px; }
.response-head h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.5px; }
.response-head p { margin:0; color:var(--muted); line-height:1.6; }

.response-table th { font-size:12px; color:var(--muted); font-weight:600; background:#f5f9fa; }
.response-table th,.response-table td { padding:14px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
.response-table .money { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.response-table a,.response-link { color:var(--primary); }
.response-scroll { overflow-x:auto; }
.response-pill { display:inline-block; background:#e9f5f8; color:#247d90; border:1px solid #d1e7ec; border-radius:5px; padding:5px 8px; font-size:12px; }
.response-note { padding:16px 18px; margin:20px 0; border-left:3px solid #45a3b7; background:#f3f9fb; color:#526572; line-height:1.6; }
.response-card { margin-bottom:20px; }
.response-card h2 { font-size:18px; margin:0 0 16px; }
.response-card h3 { font-size:15px; margin:24px 0 12px; }
